name: Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      tag:
        type: string
        default: ""
    secrets:
      LINKPORT_UPDATE_PUBLIC_KEY:
        required: false

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/platform.yml
    with:
      platform: windows
      frontend-runner: windows-2022
      browsers: chromium
      targets: '[{"os":"windows","arch":"amd64","runner":"windows-2022"},{"os":"windows","arch":"arm64","runner":"windows-11-arm"}]'
      ref: ${{ inputs.ref || github.ref }}
      tag: ${{ inputs.tag }}
    secrets:
      LINKPORT_UPDATE_PUBLIC_KEY: ${{ secrets.LINKPORT_UPDATE_PUBLIC_KEY }}
