name: Release compatibility

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      tag:
        type: string
        default: ""
    secrets:
      LINKPORT_UPDATE_PUBLIC_KEY:
        required: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
    secrets: inherit
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
    secrets: inherit
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
    secrets: inherit
