name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: windows, arch: amd64, runner: windows-2022}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: ${{ matrix.os == 'windows' && 'C:\tmp\linkport-gocache' || '/tmp/linkport-gocache' }}
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      CGO_ENABLED: ${{ matrix.os == 'darwin' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate packaging and version
        run: |
          python scripts/release.py --validate-only
          python scripts/release.py --self-test
      - name: Test
        run: go test -count=1 -timeout=5m ./...
      - name: Build native archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.os }}_${{ matrix.arch }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python scripts/release.py --target "$RELEASE_TARGET" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: linkport-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
