<style>
@font-face { font-family: "Linkport Sans"; src: url("/assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Linkport Mono"; src: url("/assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
#linkport-review {
  --lp-bg: light-dark(#ffffff, #1b1b1b);
  --lp-soft: light-dark(#f5f5f5, #252525);
  --lp-text: light-dark(#222222, #ededed);
  --lp-muted: light-dark(#666666, #b0b0b0);
  --lp-line: light-dark(#dedede, #414141);
  --lp-strong: light-dark(#414141, #d5d5d5);
  --lp-accent: light-dark(#292929, #e2e2e2);
  --lp-accent-text: light-dark(#383838, #d4d4d4);
  --lp-tint: light-dark(#f0f0f0, #303030);
  --lp-secondary: light-dark(#666666, #b5b5b5);
  --lp-warn: light-dark(#666666, #bdbdbd);
  --lp-error: light-dark(#444444, #d0d0d0);
  color: var(--lp-text);
  --lp-sans: "Linkport Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --lp-mono: "Linkport Mono", "SFMono-Regular", Consolas, monospace;
  --lp-font-scale: 1;
  font: calc(13px * var(--lp-font-scale))/1.5 var(--lp-sans);
  color-scheme: light dark;
  min-width: 0;
  height: 100%;
}
#linkport-review * { box-sizing: border-box; }
#linkport-review [hidden] { display: none !important; }
#linkport-review button, #linkport-review input, #linkport-review select { font: inherit; color: inherit; }
#linkport-review button, #linkport-review select { cursor: default; }
#linkport-review button:focus-visible, #linkport-review input:focus-visible, #linkport-review select:focus-visible { outline: 2px solid var(--lp-accent); outline-offset: 3px; }
#linkport-review button { background: var(--lp-bg); border: 1px solid var(--lp-line); padding: 6px 11px; border-radius: 6px; white-space: nowrap; transition: background-color 140ms, border-color 140ms; }
#linkport-review button:hover { background: var(--lp-soft); border-color: var(--lp-strong); }
#linkport-review button:active:not(:disabled) { background: var(--lp-tint); }
#linkport-review button:disabled { opacity: .5; }
#linkport-review .lp-primary { background: var(--lp-text); color: var(--lp-bg); border-color: var(--lp-text); }
#linkport-review .lp-primary:hover { background: var(--lp-strong); }
#linkport-review .lp-plain { border-color: transparent; background: transparent; }
#linkport-review .lp-window { height: 100%; display: flex; flex-direction: column; background: var(--lp-bg); overflow: hidden; }
#linkport-review .lp-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; flex: none; padding: 8px 20px; border-bottom: 1px solid var(--lp-line); }
#linkport-review .lp-brand { display: flex; gap: 9px; align-items: center; font-size: calc(15px * var(--lp-font-scale)); font-weight: 600; letter-spacing: -.35px; }
#linkport-review .lp-brand svg { width: 20px; height: 20px; }
#linkport-review .lp-version { color: var(--lp-muted); font: 11px/1.5 var(--lp-mono); font-weight: 400; letter-spacing: 0; margin-left: 1px; }
#linkport-review .lp-caption { color: var(--lp-muted); font-size: calc(12px * var(--lp-font-scale)); }
#linkport-review .lp-titletools, #linkport-review .lp-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#linkport-review .lp-titletools { gap: 12px; flex-wrap: nowrap; }
#linkport-review .lp-preview-label { font-size: 11px; border: 1px solid var(--lp-line); border-radius: 4px; padding: 1px 6px; }
#linkport-review select { max-width: 100%; background: var(--lp-bg); border: 1px solid var(--lp-line); border-radius: 6px; padding: 4px 6px; }
#linkport-review .lp-netstate { color: var(--lp-secondary); font-size: calc(12px * var(--lp-font-scale)); display: flex; gap: 6px; align-items: center; }
#linkport-review .lp-layout { display: grid; grid-template-columns: 148px minmax(0, 1fr); position: relative; min-height: 0; flex: 1; overflow: hidden; }
#linkport-review .lp-sidebar { padding: 16px 10px; border-right: 1px solid var(--lp-line); background: var(--lp-soft); }
#linkport-review .lp-sidebar button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 8px 12px; margin-bottom: 6px; border: 0; text-align: left; color: var(--lp-muted); background: transparent; font-weight: 500; }
#linkport-review .lp-sidebar button[aria-current="page"] { background: var(--lp-bg); color: var(--lp-text); }
#linkport-review .lp-sidebar button[aria-current="page"] svg { color: var(--lp-accent-text); }
#linkport-review .lp-panels { min-width: 0; min-height: 0; overflow: hidden; }
#linkport-review .lp-connections { position: absolute; inset: 0; pointer-events: none; z-index: 2; width: 100%; height: 100%; overflow: visible; }
#linkport-review .lp-connections path { fill: none; stroke: var(--lp-line); stroke-width: 1.4; }
#linkport-review .lp-connections path[data-link="active"] { stroke: var(--lp-accent); stroke-dasharray: 3 5; stroke-linecap: round; animation: lp-traffic 1.3s linear infinite; }
#linkport-review .lp-traffic-dot { fill: var(--lp-secondary); }
#linkport-review .lp-traffic-dot[data-direction="RX"] { fill: var(--lp-accent-text); }
@keyframes lp-traffic { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) {
  #linkport-review .lp-connections path[data-link="active"] { animation: none; }
  #linkport-review .lp-traffic-dot { display: none; }
}
#linkport-review .lp-symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
#linkport-review .lp-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#linkport-review .lp-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; background: currentColor; }
#linkport-review .lp-workspace { padding: 22px 28px; min-width: 0; height: 100%; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--lp-line) transparent; }
#linkport-review .lp-workspace:not(.lp-monitor) > * { max-width: 960px; }
#linkport-review .lp-sectionhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; flex: none; margin-bottom: 18px; }
#linkport-review h2, #linkport-review h3, #linkport-review p { margin: 0; }
#linkport-review h2 { font-size: calc(15px * var(--lp-font-scale)); font-weight: 600; letter-spacing: -.2px; }
#linkport-review .lp-topology { display: grid; grid-template-columns: 152px minmax(0,1fr); gap: 64px; align-items: center; margin: 4px 0 28px; padding: 6px 0; position: relative; }
#linkport-review .lp-local { border: 1px dashed var(--lp-strong); border-radius: 8px; padding: 22px 12px; text-align: center; position: relative; z-index: 3; background: var(--lp-bg); }
#linkport-review .lp-localicon { color: var(--lp-accent); margin: 0 auto 9px; width: 27px; height: 27px; display: block; }
#linkport-review .lp-local strong { display: block; font-weight: 600; }
#linkport-review .lp-local .lp-caption { display: block; margin-top: 4px; }
#linkport-review .lp-devices { position: relative; display: grid; gap: 14px; padding-left: 12px; min-width: 0; }
#linkport-review .lp-device { position: relative; min-width: 0; }
#linkport-review .lp-machine { display: flex; width: 100%; min-height: 38px; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: 6px; text-align: left; min-width: 0; position: relative; z-index: 3; background: var(--lp-soft); }
#linkport-review .lp-machine.lp-offline { background: var(--lp-bg); }
#linkport-review .lp-machine svg { height: 15px; width: 15px; flex: none; color: var(--lp-muted); }
#linkport-review .lp-machine-name { font-weight: 600; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#linkport-review code { font: calc(11.5px * var(--lp-font-scale)) var(--lp-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
#linkport-review .lp-machine-meta { color: var(--lp-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#linkport-review .lp-right { margin-left: auto; color: var(--lp-muted); font-size: calc(12px * var(--lp-font-scale)); text-align: right; }
#linkport-review .lp-badge { font-size: calc(11px * var(--lp-font-scale)); border: 1px solid var(--lp-line); border-radius: 5px; padding: 1px 5px; color: var(--lp-muted); white-space: nowrap; }
#linkport-review .lp-porttree { padding: 8px 0 0 22px; position: relative; display: grid; gap: 8px; }
#linkport-review .lp-portrow { position: relative; display: flex; gap: 10px; align-items: center; border: 1px dashed var(--lp-line); border-radius: 6px; min-height: 62px; padding: 9px 12px; min-width: 0; background: var(--lp-bg); z-index: 3; }
#linkport-review .lp-portrow[data-active="true"] { border-color: var(--lp-accent); background: var(--lp-tint); }
#linkport-review .lp-porticon { width: 15px; height: 15px; color: var(--lp-accent); flex: none; }
#linkport-review .lp-portdesc { min-width: 0; flex: 1; }
#linkport-review .lp-portdesc strong { font-weight: 500; overflow-wrap: anywhere; }
#linkport-review .lp-portdesc .lp-caption { display: block; margin-top: 3px; line-height: 1.5; }
#linkport-review .lp-portaction { font-size: 12px; padding: 4px 9px; }
#linkport-review .lp-portaction.lp-iconbutton { width: 30px; height: 30px; border: 1px solid var(--lp-line); }
#linkport-review .lp-connected { color: var(--lp-secondary); font-size: calc(12px * var(--lp-font-scale)); white-space: nowrap; }
#linkport-review .lp-offline { color: var(--lp-muted); }
#linkport-review .lp-mapping { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-height: 62px; padding: 10px 0; border-bottom: 1px solid var(--lp-line); }
#linkport-review .lp-mapping code { flex: 1; min-width: 150px; }
#linkport-review .lp-mapping svg { height: 15px; width: 15px; color: var(--lp-muted); }
#linkport-review .lp-mapping .lp-caption { color: var(--lp-warn); }
#linkport-review .lp-mapping-source { min-width: 210px; max-width: 100%; overflow-wrap: anywhere; font-size: calc(12px * var(--lp-font-scale)); }
#linkport-review .lp-mapping-source span { display: block; color: var(--lp-muted); font-size: calc(11px * var(--lp-font-scale)); }
#linkport-review .lp-mapping-heading { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--lp-line); }
#linkport-review .lp-mapping-heading h2 { font-size: calc(13px * var(--lp-font-scale)); font-weight: 500; }
#linkport-review .lp-session-select { max-width: 350px; }
#linkport-review .lp-monitor-selector { display: flex; align-items: center; gap: 8px; min-width: 0; }
#linkport-review .lp-monitor-selector select { min-width: 0; }
#linkport-review .lp-loglines.lp-log-empty { display: grid; place-items: center; }
#linkport-review .lp-monitor-empty { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
#linkport-review .lp-local-port-picker { display: grid; gap: 8px; margin: 12px 0; }
#linkport-review .lp-local-port-picker select { width: 100%; min-height: 34px; }
#linkport-review .lp-terminal { border: 1px solid var(--lp-line); border-radius: 6px; overflow: hidden; min-height: 0; display: flex; flex-direction: column; flex: 1; }
#linkport-review .lp-termhead { padding: 8px 11px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--lp-line); }
#linkport-review .lp-termhead strong { font-weight: 600; }
#linkport-review .lp-termhead .lp-inline { margin-left: auto; gap: 5px; }
#linkport-review input[type="checkbox"] { accent-color: var(--lp-accent); width: 14px; height: 14px; margin: 0; }
#linkport-review .lp-filter { min-width: 90px; width: 150px; padding: 6px 9px; border: 1px solid var(--lp-line); border-radius: 6px; background: var(--lp-bg); outline-offset: 1px; }
#linkport-review .lp-loglines { padding: 12px 14px; min-height: 72px; flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--lp-line) transparent; }
#linkport-review .lp-logline { display: grid; grid-template-columns: 12ch 3ch minmax(0, 1fr); gap: 12px; font: calc(12px * var(--lp-font-scale))/1.9 var(--lp-mono); font-variant-numeric: tabular-nums; }
#linkport-review .lp-logline time { color: var(--lp-muted); }
#linkport-review .lp-logline .lp-direction { color: var(--lp-accent-text); }
#linkport-review .lp-logline[data-kind="SYS"] .lp-message { color: var(--lp-muted); }
#linkport-review .lp-logline[data-kind="TX"] .lp-direction { color: var(--lp-secondary); }
#linkport-review .lp-message { overflow-wrap: anywhere; white-space: pre-wrap; }
#linkport-review .lp-empty { padding: 35px 0; text-align: center; color: var(--lp-muted); font-size: 12px; }
#linkport-review .lp-commandbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 13px; border-top: 1px solid var(--lp-line); }
#linkport-review .lp-logcontrols { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 8px; border-right: 1px solid var(--lp-line); }
#linkport-review .lp-logcontrols .lp-filter { flex: 0 1 150px; min-width: 90px; }
#linkport-review .lp-commandbar select, #linkport-review .lp-commandbar input { min-height: 31px; }
#linkport-review .lp-send { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; flex-wrap: wrap; min-width: 0; }
#linkport-review .lp-send input { flex: 1; width: 100px; min-width: 100px; border: 1px solid var(--lp-line); border-radius: 6px; background: var(--lp-bg); padding: 6px 9px; font-family: var(--lp-mono); caret-color: var(--lp-accent); }
#linkport-review input::placeholder { color: var(--lp-muted); opacity: 1; }
#linkport-review .lp-sharelist { border-top: 1px solid var(--lp-line); }
#linkport-review .lp-shareitem { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--lp-line); }
#linkport-review .lp-shareitem > svg { width: 18px; height: 18px; color: var(--lp-muted); flex: none; }
#linkport-review .lp-sharelabel { margin-left: auto; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
#linkport-review .lp-sharestatus { color: var(--lp-muted); font-size: 12px; }
#linkport-review .lp-sharing { color: var(--lp-secondary); }
#linkport-review .lp-sharepanel .lp-portdesc strong { font-weight: 500; }
#linkport-review .lp-monitor { display: flex; flex-direction: column; overflow: hidden; }
#linkport-review .lp-termhead, #linkport-review .lp-commandbar { flex: none; }
#linkport-review .lp-pluginempty { padding: 110px 20px; text-align: center; color: var(--lp-muted); }
#linkport-review .lp-pluginempty svg { width: 34px; height: 34px; color: var(--lp-accent); margin-bottom: 15px; }
#linkport-review .lp-pluginempty strong { display: block; color: var(--lp-text); font-size: 14px; font-weight: 500; margin-bottom: 7px; }
#linkport-review #lp-remote { display: flex; flex-direction: column; }
#linkport-review #lp-remote > * { flex-shrink: 0; }
#linkport-review #lp-remote .lp-connection-empty { display: flex; flex: 1 0 auto; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; max-width: none; padding: 24px 20px; text-align: center; color: var(--lp-muted); }
#linkport-review .lp-connection-empty strong { color: var(--lp-text); font-size: calc(16px * var(--lp-font-scale)); line-height: 1.4; font-weight: 600; }
#linkport-review .lp-connection-empty p { max-width: 38ch; margin: 8px 0 0; line-height: 1.6; text-wrap: pretty; }
#linkport-review .lp-connection-empty button { margin-top: 20px; min-height: 34px; max-width: 100%; padding: 6px 14px; }
#linkport-review.lp-live #lp-remote .lp-topology[data-scrollable="true"] { flex: 1 1 0; min-height: 168px; max-height: 520px; grid-template-rows: minmax(0, 1fr); }
#linkport-review.lp-live .lp-topology[data-scrollable="true"] .lp-devices { height: 100%; min-height: 0; align-content: start; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--lp-line) transparent; padding-right: 6px; }
#linkport-review.lp-live .lp-topology[data-scrollable="true"] .lp-local { align-self: center; }
#linkport-review.lp-live .lp-topology[data-scrollable="true"] .lp-machine { position: sticky; top: 0; z-index: 4; }
#linkport-review.lp-live .lp-topology[data-scrollable="true"] .lp-connections { overflow: hidden; }
#linkport-review .lp-notice, #linkport-review .lp-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#linkport-review .lp-iconbutton { display: inline-flex; align-items: center; justify-content: center; width: 29px; height: 29px; padding: 5px; border: 0; background: transparent; border-radius: 6px; position: relative; }
#linkport-review .lp-iconbutton:hover { border: 0; background: var(--lp-soft); }
#linkport-review .lp-iconbutton.lp-primary { background: var(--lp-text); color: var(--lp-bg); }
#linkport-review .lp-iconbutton.lp-primary:hover { background: var(--lp-strong); }
#linkport-review .lp-iconbutton::after { content: attr(aria-label); position: absolute; top: calc(100% + 6px); right: 0; padding: 3px 7px; border-radius: 4px; background: var(--lp-text); color: var(--lp-bg); font-size: 11px; opacity: 0; pointer-events: none; white-space: nowrap; z-index: 20; }
#linkport-review .lp-iconbutton:hover::after, #linkport-review .lp-iconbutton:focus-visible::after { opacity: 1; }
#linkport-review .lp-send .lp-iconbutton::after { top: auto; bottom: calc(100% + 6px); }
#linkport-review .lp-capability { position: relative; color: var(--lp-muted); font: 11px var(--lp-mono); }
#linkport-review .lp-capability::after { content: attr(aria-label); position: absolute; right: 0; bottom: calc(100% + 6px); background: var(--lp-text); color: var(--lp-bg); padding: 4px 7px; border-radius: 4px; font: 11px var(--lp-sans); white-space: nowrap; opacity: 0; pointer-events: none; z-index: 20; }
#linkport-review .lp-capability:hover::after { opacity: 1; }
#linkport-review .lp-iconbutton[data-refreshing="true"] svg { animation: lp-refresh .65s linear infinite; }
@keyframes lp-refresh { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  #linkport-review .lp-iconbutton[data-refreshing="true"] svg { animation: none; }
}
#linkport-review ::selection { background: var(--lp-tint); color: var(--lp-text); }
#linkport-review .lp-settings { width: 480px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--lp-line); border-radius: 10px; background: var(--lp-bg); color: var(--lp-text); font: inherit; overflow: hidden; }
#linkport-review .lp-settings[open] { display: flex; flex-direction: column; animation: lp-dialog-in 160ms ease-out; }
#linkport-review .lp-settings::backdrop { background: rgb(0 0 0 / .16); }
#linkport-review .lp-settings-head { display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding: 10px 20px; border-bottom: 1px solid var(--lp-line); flex: none; }
#linkport-review .lp-settings-head h2 { font-size: calc(15px * var(--lp-font-scale)); }
#linkport-review .lp-settings-body { padding: 0 20px; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
#linkport-review .lp-setting { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 42px; padding: 6px 0; }
#linkport-review .lp-setting > span { min-width: 0; }
#linkport-review .lp-setting select { width: 140px; flex: none; min-height: 30px; font-size: inherit; padding: 3px 8px; }
#linkport-review .lp-settings-section { padding: 12px 0; }

#linkport-review .lp-setting-info { display: grid; gap: 3px; }
#linkport-review .lp-settings-status { color: var(--lp-muted); font-size: calc(12px * var(--lp-font-scale)); line-height: 1.5; }
#linkport-review [data-preference-status] { padding: 0; }
#linkport-review [data-preference-status]:empty { display: none; }
#linkport-review .lp-setting button:not(.lp-iconbutton) { padding: 4px 10px; min-height: 30px; }
#linkport-review .lp-live-toast { position: fixed; right: 20px; bottom: 20px; max-width: min(480px, calc(100% - 40px)); padding: 9px 13px; border: 1px solid var(--lp-line); border-radius: 6px; background: var(--lp-text); color: var(--lp-bg); z-index: 30; font-size: calc(12px * var(--lp-font-scale)); overflow-wrap: anywhere; }
#linkport-review .lp-connect-form { padding: 12px 20px 20px; overflow: auto; }
#linkport-review .lp-connect-form input { width: 150px; min-height: 30px; border: 1px solid var(--lp-line); border-radius: 6px; background: var(--lp-bg); padding: 4px 8px; }
#linkport-review .lp-connect-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#linkport-review [data-service-status] { margin-bottom: 12px; overflow-wrap: anywhere; }
#linkport-review .lp-switch { appearance: none; flex: none; width: 28px !important; height: 17px !important; border-radius: 10px; background: var(--lp-line); position: relative; cursor: pointer; transition: background-color 140ms; }
#linkport-review .lp-switch::after { content: ""; position: absolute; width: 13px; height: 13px; left: 2px; top: 2px; border-radius: 50%; background: var(--lp-bg); transition: transform 140ms; }
#linkport-review .lp-switch:checked { background: var(--lp-text); }
#linkport-review .lp-switch:checked::after { transform: translateX(11px); }
@keyframes lp-dialog-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 900px) {
  #linkport-review .lp-layout { grid-template-columns: calc(112px * var(--lp-font-scale)) minmax(0,1fr); }
  #linkport-review .lp-topology { grid-template-columns: 124px minmax(0,1fr); gap: 32px; }
  #linkport-review .lp-workspace { padding: 18px; }
  #linkport-review .lp-titlebar { padding-left: 12px; padding-right: 12px; }
  #linkport-review .lp-titletools { margin-right: 0; }
  #linkport-review .lp-machine { gap: 6px; }
  #linkport-review .lp-machine-meta { display: none; }
  #linkport-review .lp-machine .lp-right { font-size: 11px; }
  #linkport-review .lp-portrow { gap: 7px; padding: 8px; }
  #linkport-review .lp-portdesc > code { display: block; }
  #linkport-review .lp-connected { font-size: 11px; }
  #linkport-review .lp-logline { gap: 8px; }
}
@media (max-width: 600px) {

    "正在下载": "Downloading",
    "正在校验": "Verifying",
    "准备更新": "Preparing update",
    "更新已就绪": "Update ready",
    "发现新版本": "New version available",
    "下载更新": "Download update",
    "检查更新": "Check for updates",
    "设备与串口": "Devices and ports",
    "本地映射": "Local ports",
    "设备离线": "Device offline",
    "等待重连": "Waiting to reconnect",
    "已断开": "Disconnected",
    "未连接": "Not connected",
    "已连接": "Connected",
    "显示已暂停": "Display paused",
    "暂停显示": "Pause display",
    "继续显示": "Resume display",
    "清空日志": "Clear log",
    "导出日志": "Export log",
    "筛选串口日志": "Filter serial log",
    "筛选日志…": "Filter logs…",
    "输入命令…": "Enter command…",
    "日志格式": "Log format",
    "监听会话": "Monitor session",
    "刷新设备": "Refresh devices",
    "暂无插件": "No plugins installed",
    "保存中…": "Saving…",
    "已保存": "Saved",
    "保存失败": "Unable to save",
    "监听中": "Monitoring",
    "共享中": "Shared",
    "未共享": "Not shared",
    "刷新中": "Refreshing",
    "已同步": "Synced",
    "设置": "Settings",
    "语言": "Language",
    "主题": "Theme",
    "浅色": "Light",
    "深色": "Dark",
    "连接": "Connect",
    "断开": "Disconnect",
    "共享": "Share",
    "监听": "Monitor",
    "插件": "Plugins",
    "本机": "Local",
    "空闲": "Idle",
    "离线": "Offline",
    "发送": "Send",
    "行尾": "Line ending",
    "文本": "Text"
  };
  const translationKeys = Object.keys(translations).sort((first, second) => second.length - first.length);
  const textSources = new WeakMap();
  const attributeSources = new WeakMap();
  function translate(value) {
    if (preferences.language !== "en") return value;
    let result = value.replace(/(\d+) 条连接/g, (_, count) => count + (count === "1" ? " connection" : " connections"))
      .replace(/(\d+) 个共享串口/g, (_, count) => count + (count === "1" ? " shared port" : " shared ports")).replace(/(\d+) 个共享/g, "$1 shared")
      .replace(/(\d+) 台可用/g, "$1 available").replace(/(\d+) (?:个|台)离线/g, "$1 offline")
      .replace(/(\d+) 台设备/g, "$1 devices").replace(/(\d+) 个已安装/g, "$1 installed")
      .replace(/(\d+) 分钟前/g, "$1 min ago");
    for (const key of translationKeys) result = result.split(key).join(translations[key]);
    return result;
  }
  function applyLanguage() {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node.parentElement?.closest("script, style, code, .lp-loglines")) continue;
      const prior = textSources.get(node);
      const source = prior && node.nodeValue === prior.output ? prior.source : node.nodeValue;
      const output = translate(source);
      textSources.set(node, { source, output });
      if (node.nodeValue !== output) node.nodeValue = output;
    }
    for (const element of all("[aria-label], [placeholder]")) {
      const prior = attributeSources.get(element) || {};
      for (const name of ["aria-label", "placeholder"]) {
        if (!element.hasAttribute(name)) continue;
        const current = element.getAttribute(name);
        const source = prior[name] && current === prior[name].output ? prior[name].source : current;
        const output = translate(source);
        prior[name] = { source, output };
        if (current !== output) element.setAttribute(name, output);
      }
      attributeSources.set(element, prior);
    }
  }
  function applyPreferences() {
    root.style.setProperty("--lp-font-scale", String(preferences.fontSize / 13));
    const appearance = preferences.theme === "system" ? "light dark" : preferences.theme;
    document.documentElement.style.colorScheme = appearance;
    document.body.style.colorScheme = appearance;
    root.style.colorScheme = appearance;
    document.documentElement.lang = preferences.language;
    for (const input of all("[data-preference]")) {
      const value = preferences[input.dataset.preference];
      if (input.type === "checkbox") input.checked = Boolean(value);
      else input.value = String(value);
    }
    applyLanguage();
    drawCurves();
  }
  for (const input of all("[data-preference]")) input.addEventListener("change", () => {
    const key = input.dataset.preference;
    preferences[key] = input.type === "checkbox" ? input.checked : key === "fontSize" ? Number(input.value) : input.value;
    preferenceRevision++;
    applyPreferences();
    const snapshot = { ...preferences };
    find("[data-preference-status]").textContent = "保存中…";
    saveQueue = saveQueue.catch(() => {}).then(async () => {
      if (nativeDesktop) await nativeRequest("preferences", "PUT", snapshot);
      else localStorage.setItem("linkport-preferences", JSON.stringify(snapshot));
      if (JSON.stringify(snapshot) === JSON.stringify(preferences)) find("[data-preference-status]").textContent = "已保存";
    }).catch(() => { find("[data-preference-status]").textContent = "保存失败"; });
  });
  async function refreshTail() {
    if (!nativeDesktop) return;
    try {
      tailState = await nativeRequest("tailscale");
      find("[data-network-state]").textContent = tailState.stale ? "Tailscale 状态待确认" : tailState.state === "Running" ? "Tailscale 已连接" : tailState.state === "NeedsLogin" ? "未登录 Tailscale" : tailState.installed ? "Tailscale 未连接" : "登录 Tailscale";
      find("[data-tail-status]").textContent = tailState.loggingIn ? "请在浏览器中完成登录" : tailState.error ? "无法读取状态" : tailState.state === "Running" ? "已连接" : tailState.installed ? "未连接" : "未安装 Tailscale";
      find("[data-settings-login]").textContent = tailState.state === "Stopped" ? "连接 Tailscale" : tailState.installed ? "登录 Tailscale" : "安装 Tailscale";
      find("[data-settings-login]").disabled = tailState.loggingIn;
      find("[data-host-name]").textContent = tailState.hostName || "本机";
      find("[data-host-ip]").textContent = tailState.ips?.[0] || "—";
    } catch { find("[data-tail-status]").textContent = "无法读取状态"; }
  }
  async function refreshUpdate() {
    if (!nativeDesktop) return;
    try {
      updateState = await nativeRequest("update");
      const labels = { unconfigured: "发布签名未配置", idle: "检查更新", checking: "正在检查更新", "up-to-date": "当前没有可用更新", available: "发现新版本", downloading: "正在下载", verifying: "正在校验", installing: "准备更新", ready: "更新已就绪", error: "操作失败，请重试" };
      find("[data-update-status]").textContent = (labels[updateState.state] || updateState.state) + (updateState.next ? " · " + updateState.next : "");
      const button = find("[data-update-action]");
      button.disabled = !updateState.configured || ["checking", "downloading", "verifying", "installing"].includes(updateState.state);
      button.setAttribute("aria-label", updateState.state === "ready" ? "重启并更新" : updateState.state === "available" ? "下载更新" : "检查更新");
    } catch { find("[data-update-status]").textContent = "操作失败，请重试"; }
  }
  function openSettings() {
    if (!settingsDialog.open) settingsDialog.showModal();
    refreshTail();
    refreshUpdate();
    if (nativeDesktop && !settingsPoll) settingsPoll = setInterval(() => { refreshTail(); refreshUpdate(); }, 3000);
  }
  find("[data-settings-open]").addEventListener("click", openSettings);
  find("[data-settings-close]").addEventListener("click", () => settingsDialog.close());
  settingsDialog.addEventListener("close", () => { clearInterval(settingsPoll); settingsPoll = null; });
  async function loginTailscale() {
    if (!nativeDesktop) {
      openSettings();
      find("[data-tail-status]").textContent = "桌面版中登录";
      return;
    }
    try {
      await nativeRequest("tailscale/login", "POST");
      find("[data-tail-status]").textContent = "请在浏览器中完成登录";
      refreshTail();
    } catch { find("[data-tail-status]").textContent = "操作失败，请重试"; }
  }
  find("[data-settings-login]").addEventListener("click", loginTailscale);
  find("[data-tailscale-login]").addEventListener("click", () => {
    if (tailState?.state === "Running") openSettings();
    else loginTailscale();
  });
  find("[data-update-action]").addEventListener("click", async () => {
    if (!nativeDesktop) {
      find("[data-update-status]").textContent = "桌面版中检查更新";
      return;
    }
    const operation = updateState.state === "ready" ? "restart" : updateState.state === "available" ? "download" : "check";
    try { await nativeRequest("update/" + operation, "POST"); refreshUpdate(); }
    catch { find("[data-update-status]").textContent = "操作失败，请重试"; }
  });
  const languageObserver = new MutationObserver(applyLanguage);
  languageObserver.observe(root, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["aria-label", "placeholder"] });
  applyPreferences();
  if (nativeDesktop) {
    drawCurves = globalThis.initializeLinkportLive(root, nativeRequest);
    const revision = preferenceRevision;
    nativeRequest("preferences").then(saved => {
      if (preferenceRevision === revision) { preferences = saved; applyPreferences(); }
    }).catch(() => { find("[data-preference-status]").textContent = "保存失败"; });
    refreshTail();
    setInterval(refreshTail, 15000);
  }
  if (globalThis.Tweak) {
    const tweaks = { spacing: 20 };
    const tweak = new Tweak({ container: root, onChange: () => {
      for (const panel of all(".lp-workspace")) panel.style.padding = tweaks.spacing + "px";
    } });
    tweak.addSlider(tweaks, "spacing", { label: "工作区留白", min: 12, max: 28, unit: "px" });
  }
})();
