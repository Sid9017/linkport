map $http_upgrade $linkport_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 207.148.110.58;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/linkport-relay/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkport-relay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LinkportTLS:1m;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    location = /relay-directory.json {
        root /var/www/linkport;
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /relay {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $linkport_connection;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    location ~ ^/(ping|healthz)$ {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}
